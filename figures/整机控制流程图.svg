<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1860" viewBox="0 0 760 1860">
<title>System control architecture</title>
<desc>Teleoperation master to six-axis arm, and chassis commands to wheel-legged chassis. Dashed feedback paths show encoder and IMU measurements.</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#111"/></marker></defs>
<rect width="760" height="1860" fill="white"/>
<g font-family="DejaVu Sans, sans-serif" fill="#111">
<text x="380" y="39" text-anchor="middle" font-size="30" font-weight="bold">(a) Teleoperation and arm control</text>
<rect x="45" y="75" width="320" height="135" fill="white" stroke="#111" stroke-width="2.8"/>
<text x="205.0" y="117.28" text-anchor="middle" font-size="26" font-weight="normal">Delta master</text>
<text x="205.0" y="151.6" text-anchor="middle" font-size="26" font-weight="normal">Forward kinematics</text>
<text x="205.0" y="185.92" text-anchor="middle" font-size="26" font-weight="normal">Gravity compensation</text>
<rect x="395" y="75" width="320" height="135" fill="white" stroke="#111" stroke-width="2.8"/>
<text x="555.0" y="117.28" text-anchor="middle" font-size="26" font-weight="normal">RPY handle</text>
<text x="555.0" y="151.6" text-anchor="middle" font-size="26" font-weight="normal">Moving-axis rotations</text>
<text x="555.0" y="185.92" text-anchor="middle" font-size="26" font-weight="normal">Roll / pitch / yaw</text>
<polyline points="205,210 205,248 380,248" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/>
<polyline points="555,210 555,248 380,248" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="380" cy="248" r="4" fill="#111"/>
<polyline points="380,248 380,288" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="170" y="288" width="420" height="105" fill="white" stroke="#111" stroke-width="2.8"/>
<text x="380.0" y="332.13" text-anchor="middle" font-size="27" font-weight="normal">Master pose: xyz + RPY</text>
<text x="380.0" y="367.77" text-anchor="middle" font-size="27" font-weight="normal">Wireless link + TD</text>
<polyline points="380,393 380,449" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="170" y="449" width="420" height="105" fill="white" stroke="#111" stroke-width="2.8"/>
<text x="380.0" y="493.13" text-anchor="middle" font-size="27" font-weight="normal">Pose mapping</text>
<text x="380.0" y="528.7700000000001" text-anchor="middle" font-size="27" font-weight="normal">Arm inverse kinematics</text>
<text x="403" y="589" text-anchor="start" font-size="25" font-weight="normal">Joint targets</text>
<polyline points="380,554 380,618" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="170" y="618" width="420" height="140" fill="white" stroke="#111" stroke-width="2.8"/>
<text x="380.0" y="679.63" text-anchor="middle" font-size="27" font-weight="normal">Joint position / velocity PID</text>
<text x="380.0" y="715.2700000000001" text-anchor="middle" font-size="27" font-weight="normal">+ gravity feedforward</text>
<polyline points="380,758 380,810" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="170" y="810" width="420" height="76" fill="#eef1f4" stroke="#111" stroke-width="2.8"/>
<text x="380.0" y="858.15" text-anchor="middle" font-size="29" font-weight="normal">Six-axis arm</text>
<polyline points="170,848 65,848 65,688 170,688" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="74" y="790" text-anchor="start" font-size="24" font-weight="normal">Encoders</text>
<line x1="35" y1="933" x2="725" y2="933" stroke="#777" stroke-width="1.5"/>
<text x="380" y="981" text-anchor="middle" font-size="30" font-weight="bold">(b) Chassis control</text>
<rect x="170" y="1015" width="420" height="100" fill="white" stroke="#111" stroke-width="2.8"/>
<text x="380.0" y="1056.63" text-anchor="middle" font-size="27" font-weight="normal">Chassis commands</text>
<text x="380.0" y="1092.27" text-anchor="middle" font-size="27" font-weight="normal">Velocity, height, attitude</text>
<polyline points="380,1115 380,1149" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round"/>
<circle cx="380" cy="1149" r="4" fill="#111"/>
<polyline points="380,1149 205,1149 205,1185" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="380,1149 555,1149 555,1185" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="1185" width="315" height="160" fill="white" stroke="#111" stroke-width="2.8"/>
<text x="207.5" y="1225.88" text-anchor="middle" font-size="24" font-weight="normal">Motion references</text>
<text x="207.5" y="1257.5600000000002" text-anchor="middle" font-size="24" font-weight="normal">Mecanum wheel speeds</text>
<text x="207.5" y="1289.24" text-anchor="middle" font-size="24" font-weight="normal">Dual-loop P + leg IK</text>
<text x="207.5" y="1320.92" text-anchor="middle" font-size="24" font-weight="normal">IMU feedback</text>
<rect x="395" y="1185" width="315" height="160" fill="white" stroke="#111" stroke-width="2.8"/>
<text x="552.5" y="1224.25" text-anchor="middle" font-size="25" font-weight="normal">Torque feedforward</text>
<text x="552.5" y="1257.25" text-anchor="middle" font-size="25" font-weight="normal">Rigid-body allocation</text>
<text x="552.5" y="1290.25" text-anchor="middle" font-size="25" font-weight="normal">Wheel / leg torque map</text>
<text x="552.5" y="1323.25" text-anchor="middle" font-size="25" font-weight="normal">State feedback</text>
<polyline points="205,1345 205,1398" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="50" y="1398" width="315" height="130" fill="white" stroke="#111" stroke-width="2.8"/>
<text x="207.5" y="1439.72" text-anchor="middle" font-size="24" font-weight="normal">Wheel / leg servos</text>
<text x="207.5" y="1471.4" text-anchor="middle" font-size="24" font-weight="normal">Position / speed loops</text>
<text x="207.5" y="1503.0800000000002" text-anchor="middle" font-size="24" font-weight="normal">Encoder feedback</text>
<polyline points="205,1528 205,1570 360,1570" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="555,1345 555,1570 400,1570" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="380" cy="1570" r="20" fill="white" stroke="#111" stroke-width="2.6"/>
<text x="345" y="1553" text-anchor="middle" font-size="27" font-weight="normal">+</text>
<text x="416" y="1553" text-anchor="middle" font-size="27" font-weight="normal">+</text>
<polyline points="380,1590 380,1635" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="170" y="1635" width="420" height="78" fill="#eef1f4" stroke="#111" stroke-width="2.8"/>
<text x="380.0" y="1683.8" text-anchor="middle" font-size="28" font-weight="normal">Wheel-legged chassis</text>
<polyline points="380,1713 380,1747" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="170" y="1747" width="420" height="72" fill="white" stroke="#111" stroke-width="2.8"/>
<text x="380.0" y="1792.45" text-anchor="middle" font-size="27" font-weight="normal">IMU + joint encoders</text>
<polyline points="170,1783 22,1783 22,1265 50,1265" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<polyline points="22,1463 50,1463" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<circle cx="22" cy="1463" r="4" fill="#111"/>
<polyline points="590,1783 738,1783 738,1265 710,1265" fill="none" stroke="#111" stroke-width="2.6" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#arrow)"/>
<text x="380" y="1850" text-anchor="middle" font-size="23" font-weight="normal">Solid: forward path     Dashed: feedback</text>
</g></svg>